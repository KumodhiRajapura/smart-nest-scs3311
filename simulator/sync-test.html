<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Nest — sync test harness</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font: 14px/1.5 system-ui, sans-serif;
    margin: 0; padding: 24px;
    display: grid; grid-template-columns: 1fr 380px; gap: 24px;
    align-items: start;
  }
  @media (max-width: 900px) { body { grid-template-columns: 1fr; } }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { opacity: .7; margin: 0 0 20px; }
  .device {
    border: 1px solid rgba(128,128,128,.35); border-radius: 8px;
    padding: 12px 14px; margin-bottom: 10px;
  }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .name { font-weight: 600; flex: 1; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .ON { background: #22c55e; } .OFF { background: #9ca3af; }
  .ERROR { background: #ef4444; } .DISCONNECTED { background: #f59e0b; }
  .meta { opacity: .65; font-size: 12px; margin-top: 6px; }
  button { font: inherit; padding: 4px 10px; border-radius: 6px;
           border: 1px solid rgba(128,128,128,.45); background: transparent;
           cursor: pointer; }
  button:hover { background: rgba(128,128,128,.15); }
  #log {
    font-family: ui-monospace, monospace; font-size: 12px;
    border: 1px solid rgba(128,128,128,.35); border-radius: 8px;
    padding: 12px; height: 70vh; overflow-y: auto; white-space: pre-wrap;
  }
  .banner { padding: 12px; border-radius: 8px; background: rgba(239,68,68,.15);
            border: 1px solid rgba(239,68,68,.4); margin-bottom: 16px; }
  .channels { margin-top: 8px; padding-left: 12px;
              border-left: 2px solid rgba(128,128,128,.3); }
</style>
</head>
<body>

<div>
  <h1>Sync test harness</h1>
  <p class="sub">
    Not the simulator dashboard — this is the rig for proving bidirectional
    sync. Drive a device from the phone and watch the event log here; drive it
    from here and watch the phone.
  </p>
  <div id="error" class="banner" hidden></div>
  <div id="devices"></div>
</div>

<div>
  <div class="row" style="margin-bottom:10px">
    <strong style="flex:1">Event log</strong>
    <button id="clear">Clear</button>
  </div>
  <div id="log"></div>
</div>

<script type="module">
import { connectSmartNest, STATUS } from './smart-nest-firestore.js';
import { firebaseConfig } from './firebase-config.js';

const $devices = document.getElementById('devices');
const $log = document.getElementById('log');
const $error = document.getElementById('error');

function log(line) {
  const stamp = new Date().toTimeString().slice(0, 8);
  $log.textContent = `${stamp}  ${line}\n` + $log.textContent;
}

function showError(err) {
  $error.hidden = false;
  $error.textContent = String(err);
  log(`ERROR ${err}`);
}

// Previous status per device, so the log records transitions rather than
// repeating the whole document on every snapshot.
const seen = new Map();
let heartbeatStop = null;

const nest = await connectSmartNest(firebaseConfig).catch((err) => {
  showError(err);
  throw err;
});

log('connected, signed in anonymously');

nest.watchDevices(render, showError);

function render(devices) {
  for (const device of devices) {
    const before = seen.get(device.id);
    seen.set(device.id, device.status);

    if (before !== undefined && before !== device.status) {
      // Rough end-to-end latency: server write time vs the moment this browser
      // rendered it. Clock skew between machines makes it approximate, but it
      // is the right order of magnitude for the report.
      const written = device.updatedAt?.toDate?.();
      const lag = written ? `${Date.now() - written.getTime()}ms` : '?';
      log(
        `${device.name}: ${before} -> ${device.status} ` +
        `(by ${device.updatedBy || '?'}, ${device.statusReason || '-'}, +${lag})`
      );
    }
  }

  $devices.innerHTML = '';
  for (const device of devices) $devices.append(card(device));

  syncHeartbeats(devices.map((d) => d.id));
}

// Keep every device looking alive while this page is open, so the worker's
// heartbeat watchdog can be switched on without everything falling offline.
// Restarted only when the set of devices actually changes -- not on every
// snapshot, which would reset the interval before it ever fired.
let heartbeatIds = '';
function syncHeartbeats(ids) {
  const key = ids.slice().sort().join(',');
  if (key === heartbeatIds) return;
  heartbeatIds = key;
  heartbeatStop?.();
  heartbeatStop = nest.startHeartbeats(ids, 10000);
  log(`heartbeats running for ${ids.length} devices`);
}

function card(device) {
  const el = document.createElement('div');
  el.className = 'device';

  const row = document.createElement('div');
  row.className = 'row';
  row.innerHTML = `
    <span class="dot ${device.status}"></span>
    <span class="name">${device.name}</span>
    <span>${device.status}</span>
  `;

  if (device.type !== 'camera') {
    row.append(
      button(device.status === STATUS.on ? 'Switch off' : 'Switch on', () =>
        nest.reportPower(device.id, device.status !== STATUS.on).catch(showError)
      )
    );
  }

  row.append(
    device.status === STATUS.error
      ? button('Clear fault', () => nest.clearFault(device.id).catch(showError))
      : button('Fault', () => nest.reportFault(device.id).catch(showError))
  );

  row.append(button('Beat', () => nest.heartbeat(device.id).catch(showError)));

  el.append(row);

  if (Array.isArray(device.channels) && device.channels.length) {
    const box = document.createElement('div');
    box.className = 'channels';
    for (const channel of device.channels) {
      const line = document.createElement('div');
      line.className = 'row';
      line.style.marginTop = '4px';
      line.innerHTML = `<span class="dot ${channel.isOn ? 'ON' : 'OFF'}"></span>
                        <span class="name">${channel.label}</span>`;
      line.append(
        button(channel.isOn ? 'off' : 'on', () =>
          nest.reportChannel(device.id, channel.index, !channel.isOn).catch(showError)
        )
      );
      box.append(line);
    }
    el.append(box);
  }

  const meta = document.createElement('div');
  meta.className = 'meta';
  const on = device.turnedOnAt?.toDate?.();
  meta.textContent = [
    device.type,
    `grid (${device.gridX ?? '?'},${device.gridY ?? '?'})`,
    device.maxOnDurationMinutes ? `limit ${device.maxOnDurationMinutes}min` : null,
    on ? `on since ${on.toTimeString().slice(0, 8)}` : null,
    device.updatedBy ? `last by ${device.updatedBy}` : null,
  ].filter(Boolean).join(' · ');
  el.append(meta);

  return el;
}

function button(label, onClick) {
  const b = document.createElement('button');
  b.textContent = label;
  b.addEventListener('click', onClick);
  return b;
}

document.getElementById('clear').addEventListener('click', () => {
  $log.textContent = '';
});
</script>
</body>
</html>
